<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover pozwala odsunąć pasek zakładek od dolnej krawędzi iPhone'a (env(safe-area-inset-bottom)). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BudgetApp</title>
  <!-- Pusta ikona, żeby przeglądarka nie szukała favicon.ico (błąd 404 w konsoli). Prawdziwa ikona w Z9. -->
  <link rel="icon" href="data:,">
  <link rel="preload" href="./fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="month-header">
      <button type="button" class="icon-button" id="previous-month" aria-label="Poprzedni miesiąc">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <!-- aria-live: czytnik ekranu przeczyta nową nazwę po przełączeniu miesiąca. -->
      <h1 class="month-name" id="month-name" aria-live="polite"></h1>
      <button type="button" class="icon-button" id="next-month" aria-label="Następny miesiąc">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </header>

    <main>
      <section class="view" id="view-plan" aria-labelledby="view-plan-title">
        <div class="view-header">
          <h2 class="view-title" id="view-plan-title" tabindex="-1">Plan</h2>
          <span class="badge" id="closed-badge" hidden>Zamknięty</span>
        </div>
        <!-- Miesiąc bez planu: app.js wstawia tu kartę z szablonu #no-plan-template. -->
        <div data-no-plan></div>

        <div class="plan-content" id="plan-content" hidden>
          <div class="card card--main">
            <p class="summary-label">Zostało do zaplanowania</p>
            <p class="summary-amount" id="remaining-amount"></p>
            <div class="split-bar" id="split-bar" role="img">
              <span class="split-segment split-segment--savings" data-part="savings"></span>
              <span class="split-segment split-segment--investments" data-part="investments"></span>
              <span class="split-segment split-segment--expenses" data-part="expenses"></span>
              <span class="split-segment split-segment--remaining" data-part="remaining"></span>
            </div>
          </div>

          <div class="card sliders">
            <div class="slider-field">
              <div class="slider-header">
                <label class="slider-label" for="savings-slider">Oszczędności</label>
                <output class="slider-value" id="savings-value" for="savings-slider"></output>
              </div>
              <input type="range" class="slider" id="savings-slider" data-slider="savings"
                min="0" max="100" step="1" aria-describedby="savings-error">
              <p class="field-error" id="savings-error" hidden></p>
            </div>

            <div class="slider-field">
              <div class="slider-header">
                <label class="slider-label" for="investment-slider">Inwestycje</label>
                <output class="slider-value" id="investment-value" for="investment-slider"></output>
              </div>
              <input type="range" class="slider" id="investment-slider" data-slider="investment"
                min="0" max="100" step="1" aria-describedby="investment-error">
              <p class="field-error" id="investment-error" hidden></p>
            </div>
          </div>
        </div>
      </section>

      <!-- Przychody i Wydatki mają ten sam układ; obsługuje je jeden komponent listy w app.js. -->
      <section class="view" id="view-incomes" data-list="incomes" aria-labelledby="view-incomes-title" hidden>
        <h2 class="view-title" id="view-incomes-title" tabindex="-1">Przychody</h2>
        <div data-no-plan></div>

        <div class="list-content" data-part="content" hidden>
          <form class="card item-form" data-part="form" novalidate>
            <div class="field">
              <label class="field-label" for="incomes-name">Nazwa</label>
              <input class="field-input" id="incomes-name" name="name" type="text"
                autocomplete="off" aria-describedby="incomes-name-error">
              <p class="field-error" id="incomes-name-error" hidden></p>
            </div>
            <div class="field">
              <label class="field-label" for="incomes-amount">Kwota</label>
              <input class="field-input" id="incomes-amount" name="amount" type="text"
                inputmode="decimal" autocomplete="off" aria-describedby="incomes-amount-error">
              <p class="field-error" id="incomes-amount-error" hidden></p>
            </div>
            <button type="submit" class="button button--primary">Dodaj</button>
            <p class="field-error" data-part="form-error" role="alert" hidden></p>
          </form>

          <div class="card">
            <ul class="item-list" data-part="items"></ul>
            <p class="list-empty" data-part="empty">Brak pozycji</p>
            <p class="list-total">
              <span>Razem</span>
              <span class="list-total-amount" data-part="total"></span>
            </p>
          </div>
        </div>
      </section>

      <section class="view" id="view-expenses" data-list="expenses" aria-labelledby="view-expenses-title" hidden>
        <h2 class="view-title" id="view-expenses-title" tabindex="-1">Wydatki</h2>
        <div data-no-plan></div>

        <div class="list-content" data-part="content" hidden>
          <form class="card item-form" data-part="form" novalidate>
            <div class="field">
              <label class="field-label" for="expenses-name">Nazwa</label>
              <input class="field-input" id="expenses-name" name="name" type="text"
                autocomplete="off" aria-describedby="expenses-name-error">
              <p class="field-error" id="expenses-name-error" hidden></p>
            </div>
            <div class="field">
              <label class="field-label" for="expenses-amount">Kwota</label>
              <input class="field-input" id="expenses-amount" name="amount" type="text"
                inputmode="decimal" autocomplete="off" aria-describedby="expenses-amount-error">
              <p class="field-error" id="expenses-amount-error" hidden></p>
            </div>
            <button type="submit" class="button button--primary">Dodaj</button>
            <p class="field-error" data-part="form-error" role="alert" hidden></p>
          </form>

          <div class="card">
            <ul class="item-list" data-part="items"></ul>
            <p class="list-empty" data-part="empty">Brak pozycji</p>
            <p class="list-total">
              <span>Razem</span>
              <span class="list-total-amount" data-part="total"></span>
            </p>
          </div>
        </div>
      </section>

      <section class="view" id="view-more" aria-labelledby="view-more-title" hidden>
        <h2 class="view-title" id="view-more-title">Więcej</h2>
        <div class="card">
          <p>Ten ekran pojawi się wkrótce.</p>
        </div>
      </section>
    </main>

    <!-- Szablony pozycji listy; app.js je kopiuje i wpisuje tekst przez textContent. -->
    <template id="item-template">
      <li class="item">
        <div class="item-row">
          <button type="button" class="item-display" data-action="edit">
            <span class="item-name"></span>
            <span class="item-amount"></span>
          </button>
          <button type="button" class="icon-button" data-action="remove">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg>
          </button>
        </div>
        <p class="field-error item-error" role="alert" hidden></p>
      </li>
    </template>

    <template id="item-editor-template">
      <li class="item item--editing">
        <div class="item-editor">
          <div class="field">
            <label class="field-label" data-field="name">Nazwa</label>
            <input class="field-input" data-field="name" type="text" autocomplete="off" enterkeyhint="done">
            <p class="field-error" data-field="name" hidden></p>
          </div>
          <div class="field">
            <label class="field-label" data-field="amount">Kwota</label>
            <input class="field-input" data-field="amount" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done">
            <p class="field-error" data-field="amount" hidden></p>
          </div>
        </div>
      </li>
    </template>

    <!-- Pozycja zamkniętego miesiąca: sam tekst, bez edycji i kosza. -->
    <template id="item-readonly-template">
      <li class="item">
        <div class="item-display item-display--readonly">
          <span class="item-name"></span>
          <span class="item-amount"></span>
        </div>
      </li>
    </template>

    <!-- Karta miesiąca bez planu, wspólna dla zakładek Plan, Przychody i Wydatki.
         Miesiąc zamknięty pokazuje tylko napis „Brak planu”. -->
    <template id="no-plan-template">
      <div class="card card--main">
        <div class="plan-start" data-part="start">
          <h3 class="plan-start-title" data-part="title"></h3>
          <div class="plan-start-actions">
            <button type="button" class="button button--primary" data-create="copy"></button>
            <button type="button" class="button button--secondary" data-create="empty">Zacznij od zera</button>
          </div>
          <p class="field-error" data-part="error" role="alert" hidden></p>
        </div>
        <p data-part="closed">Brak planu</p>
      </div>
    </template>

    <nav class="tab-bar" aria-label="Zakładki">
      <button type="button" class="tab" data-view="plan" aria-current="page">
        <span class="tab-pill">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg>
        </span>
        Plan
      </button>
      <button type="button" class="tab" data-view="incomes">
        <span class="tab-pill">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        </span>
        Przychody
      </button>
      <button type="button" class="tab" data-view="expenses">
        <span class="tab-pill">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>
        </span>
        Wydatki
      </button>
      <button type="button" class="tab" data-view="more">
        <span class="tab-pill">
          <svg class="icon icon--filled" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.75"/><circle cx="12" cy="12" r="1.75"/><circle cx="19" cy="12" r="1.75"/></svg>
        </span>
        Więcej
      </button>
    </nav>
  </div>
</body>
</html>
